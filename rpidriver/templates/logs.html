{% extends "layout.html" %}
{% block title %}RPiDriver — {{ _('Logs') }}{% endblock %}

{% block content %}

<div class="logs-toolbar">
  <h2 style="margin:0">{{ _('Live Logs') }}</h2>
  <div class="logs-controls">
    <input id="log-search" type="search" class="log-search-input"
           placeholder="{{ _('Filter…') }}" oninput="applyFilter()" />
    <button class="btn btn-secondary btn-sm" onclick="clearLog()">🗑 {{ _('Clear') }}</button>
    <button class="btn btn-secondary btn-sm" id="pause-btn" onclick="togglePause()">⏸ {{ _('Pause') }}</button>
    <button class="btn btn-secondary btn-sm" onclick="loadRest()">↻ {{ _('Refresh') }}</button>
    <span id="conn-status" class="badge badge-warning">{{ _('Connecting…') }}</span>
  </div>
</div>

<div class="card" style="padding:0;overflow:hidden;">
  <pre id="log-output" class="log-output"></pre>
</div>

<script>
const output    = document.getElementById('log-output');
const connBadge = document.getElementById('conn-status');
const pauseBtn  = document.getElementById('pause-btn');
const searchEl  = document.getElementById('log-search');

let paused    = false;
let es        = null;
let sseOk     = false;
let pollTimer = null;
const MAX_LINES = 600;

// ── Helpers ──────────────────────────────────────────────────────────────────
function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function colorClass(text) {
  const t = text.toLowerCase();
  if (t.includes('error') || t.includes('traceback') || t.includes('exception') || t.includes('critical'))
    return 'log-error';
  if (t.includes('warn'))
    return 'log-warning';
  if (t.includes('info'))
    return 'log-info';
  if (t.includes('debug'))
    return 'log-debug';
  return '';
}

function isAtBottom() {
  return output.scrollHeight - output.scrollTop - output.clientHeight < 60;
}

function applyFilter() {
  const q = searchEl.value.toLowerCase();
  for (const div of output.children) {
    div.style.display = (!q || div.textContent.toLowerCase().includes(q)) ? '' : 'none';
  }
}

function appendLine(text) {
  if (paused || !text.trim()) return;
  const shouldScroll = isAtBottom();
  const div  = document.createElement('div');
  const cls  = colorClass(text);
  if (cls) {
    const span = document.createElement('span');
    span.className   = cls;
    span.textContent = text;
    div.appendChild(span);
  } else {
    div.textContent = text;
  }
  // Apply current filter
  const q = searchEl.value.toLowerCase();
  if (q && !text.toLowerCase().includes(q)) div.style.display = 'none';

  output.appendChild(div);
  while (output.children.length > MAX_LINES) output.removeChild(output.firstChild);
  if (shouldScroll) output.scrollTop = output.scrollHeight;
}

function setStatus(text, cls) {
  connBadge.textContent = text;
  connBadge.className   = 'badge ' + cls;
}

// ── SSE (primary) ─────────────────────────────────────────────────────────────
function connectSSE() {
  if (es) { try { es.close(); } catch(e){} }

  es = new EventSource('/api/logs/stream');

  const timeout = setTimeout(() => {
    if (!sseOk) { es.close(); startPoll(); }
  }, 5000);

  es.onopen = () => {
    clearTimeout(timeout);
    sseOk = true;
    if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
    setStatus('{{ _("Live") }}', 'badge-connected');
  };

  es.onmessage = (e) => { appendLine(e.data); };

  es.onerror = () => {
    setStatus('{{ _("Reconnecting…") }}', 'badge-warning');
    if (!sseOk) { clearTimeout(timeout); es.close(); startPoll(); }
  };
}

// ── REST polling (fallback) ───────────────────────────────────────────────────
let _lastLines = '';

async function loadRest() {
  try {
    const resp = await fetch('/api/logs?lines=200');
    const data = await resp.json();
    const text = data.logs || '';
    if (text === _lastLines) return;
    _lastLines = text;
    output.innerHTML = '';
    text.split('\n').forEach(line => appendLine(line));
  } catch(e) {
    setStatus('❌ ' + e.message, 'badge-warning');
  }
}

function startPoll() {
  setStatus('{{ _("Polling") }}', 'badge-warning');
  loadRest();
  if (!pollTimer) pollTimer = setInterval(loadRest, 4000);
}

// ── Controls ──────────────────────────────────────────────────────────────────
function clearLog() { output.innerHTML = ''; _lastLines = ''; }

function togglePause() {
  paused = !paused;
  pauseBtn.innerHTML = paused ? '▶ {{ _("Resume") }}' : '⏸ {{ _("Pause") }}';
  pauseBtn.classList.toggle('btn-primary',   paused);
  pauseBtn.classList.toggle('btn-secondary', !paused);
}

// ── Init ──────────────────────────────────────────────────────────────────────
connectSSE();

document.addEventListener('visibilitychange', () => {
  if (!document.hidden) {
    if (sseOk && es && es.readyState === EventSource.CLOSED) connectSSE();
    else if (!sseOk && !pollTimer) startPoll();
  }
});
</script>

{% endblock %}
