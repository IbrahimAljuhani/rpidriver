{% extends "layout.html" %}
{% block title %}RPiDriver — {{ _('Logs') }}{% endblock %}

{% block content %}

<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:1.25rem;flex-wrap:wrap;gap:.75rem;">
  <h2 style="margin:0">{{ _('Live Logs') }}</h2>
  <div style="display:flex;align-items:center;gap:.75rem;">
    <label style="display:flex;align-items:center;gap:.4rem;font-size:.85rem;cursor:pointer;">
      <input type="checkbox" id="auto-scroll" checked>
      {{ _('Auto-scroll') }}
    </label>
    <button class="btn btn-secondary btn-sm" onclick="clearLog()">
      🗑 {{ _('Clear') }}
    </button>
    <button class="btn btn-secondary btn-sm" id="pause-btn" onclick="togglePause()">
      ⏸ {{ _('Pause') }}
    </button>
    <span id="conn-status" class="badge badge-warning">{{ _('Connecting…') }}</span>
  </div>
</div>

<div class="card" style="padding:0;overflow:hidden;">
  <pre id="log-output" style="
    margin:0; padding:1rem;
    background:#0f1117; color:#d4d4d8;
    font-family:'Courier New',Courier,monospace; font-size:.78rem;
    line-height:1.55;
    height:calc(100vh - 220px); min-height:300px;
    overflow-y:auto; overflow-x:auto;
    white-space:pre; word-break:normal;
    border-radius:8px;
  "></pre>
</div>

<style>
.log-line-error   { color: #f87171; }
.log-line-warning { color: #fbbf24; }
.log-line-info    { color: #86efac; }
.log-line-debug   { color: #93c5fd; }
.btn-sm { padding: .3rem .75rem; font-size: .82rem; }
.btn-secondary {
  background: transparent;
  border: 1px solid var(--border, #e5e7eb);
  color: var(--text, #1c1c1e);
}
.btn-secondary:hover { background: var(--surface, #f9fafb); }
</style>

<script>
const output    = document.getElementById('log-output');
const connBadge = document.getElementById('conn-status');
const pauseBtn  = document.getElementById('pause-btn');
const autoScroll= document.getElementById('auto-scroll');

let paused = false;
let es     = null;
const MAX_LINES = 500;

// ── Helpers ──────────────────────────────────────────────────────────────────
function colorLine(text) {
  const t = text.toLowerCase();
  if (t.includes(' error') || t.includes('traceback') || t.includes('exception'))
    return `<span class="log-line-error">${escHtml(text)}</span>`;
  if (t.includes('warning') || t.includes('warn'))
    return `<span class="log-line-warning">${escHtml(text)}</span>`;
  if (t.includes(' info') || t.includes('[info]'))
    return `<span class="log-line-info">${escHtml(text)}</span>`;
  if (t.includes('debug'))
    return `<span class="log-line-debug">${escHtml(text)}</span>`;
  return escHtml(text);
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function appendLine(text) {
  if (paused) return;
  const line = document.createElement('div');
  line.innerHTML = colorLine(text);
  output.appendChild(line);

  // Trim excess lines
  while (output.children.length > MAX_LINES) {
    output.removeChild(output.firstChild);
  }

  if (autoScroll.checked) {
    output.scrollTop = output.scrollHeight;
  }
}

// ── SSE connection ────────────────────────────────────────────────────────────
function connect() {
  if (es) { es.close(); }

  es = new EventSource('/api/logs/stream');

  es.onopen = () => {
    connBadge.textContent = '{{ _("Live") }}';
    connBadge.className   = 'badge badge-connected';
  };

  es.onmessage = (e) => {
    appendLine(e.data);
  };

  es.onerror = () => {
    connBadge.textContent = '{{ _("Reconnecting…") }}';
    connBadge.className   = 'badge badge-warning';
    // Browser will auto-reconnect SSE; we just update the badge
  };
}

// ── Controls ──────────────────────────────────────────────────────────────────
function clearLog() {
  output.innerHTML = '';
}

function togglePause() {
  paused = !paused;
  pauseBtn.innerHTML = paused ? '▶ {{ _("Resume") }}' : '⏸ {{ _("Pause") }}';
  pauseBtn.classList.toggle('btn-primary', paused);
  pauseBtn.classList.toggle('btn-secondary', !paused);
}

// ── Start ─────────────────────────────────────────────────────────────────────
connect();

// Reconnect when the tab becomes visible again after being hidden
document.addEventListener('visibilitychange', () => {
  if (!document.hidden && (!es || es.readyState === EventSource.CLOSED)) {
    connect();
  }
});
</script>

{% endblock %}
